<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Live Eyes</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --accent: #ffd400;   /* yellow on black: the highest-contrast pair for low vision */
      --muted: #b8b8b8;
      --danger: #ff6b5e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Camera preview. Decorative: it is for sighted helpers and judges. */
    #preview {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .4s;
    }
    body[data-phase="live"] #preview { opacity: .45; }

    /* The whole screen is one button. */
    #main {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.25rem;
      padding: env(safe-area-inset-top) 1.5rem 38vh;
      background: transparent;
      color: inherit;
      border: 0;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #main:focus-visible { outline: 4px solid var(--accent); outline-offset: -8px; }

    #ring {
      width: min(52vw, 220px); aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid var(--accent);
      display: grid; place-items: center;
    }
    #dot {
      width: 34%; aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
    }
    #label, #sub { text-shadow: 0 1px 10px #000, 0 0 2px #000; } /* stays readable over a bright camera view */
    #label { font-size: clamp(2rem, 9vw, 3rem); font-weight: 800; letter-spacing: -.01em; }
    #sub { font-size: clamp(1.05rem, 4.5vw, 1.3rem); color: var(--muted); max-width: 22em; text-align: center; text-wrap: balance; }
    body[data-error] #sub { color: var(--danger); }

    body[data-phase="connecting"] #ring { border-style: dashed; animation: spin 2.4s linear infinite; }
    body[data-phase="live"][data-activity="listening"] #dot { animation: breathe 2.2s ease-in-out infinite; }
    body[data-phase="live"][data-activity="speaking"] #dot { animation: breathe .55s ease-in-out infinite; }
    body[data-phase="live"][data-activity="thinking"] #ring { border-style: dotted; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.7); } }
    @media (prefers-reduced-motion: reduce) {
      #ring, #dot { animation: none !important; }
    }

    #brand {
      position: fixed; z-index: 2;
      top: calc(env(safe-area-inset-top) + .9rem); left: 1rem;
      font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .95rem;
      pointer-events: none;
    }
    #modeLink {
      position: fixed; z-index: 2;
      top: calc(env(safe-area-inset-top) + .5rem); right: .6rem;
      padding: .45rem .7rem;
      color: var(--accent); font-size: .95rem; font-weight: 600;
      text-underline-offset: .2em;
    }
    #modeLink:focus-visible { outline: 3px solid var(--accent); }

    #watching {
      position: fixed; z-index: 1; left: 50%; transform: translateX(-50%);
      top: calc(env(safe-area-inset-top) + 3.4rem);
      max-width: 90vw;
      padding: .45rem .9rem;
      border-radius: 999px;
      background: var(--accent); color: #000;
      font-weight: 700; font-size: 1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    #watching[hidden] { display: none; }

    /* Captions sit on top of the button but let taps fall through to it. */
    #captions {
      position: fixed; z-index: 1;
      left: 0; right: 0; bottom: 0;
      max-height: 36vh; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-end; gap: .55rem;
      padding: 2.5rem 1.1rem calc(env(safe-area-inset-bottom) + 1.1rem);
      background: linear-gradient(transparent, rgba(0,0,0,.92) 35%);
      font-size: clamp(1.05rem, 4.6vw, 1.3rem); line-height: 1.35;
      pointer-events: none;
    }
    #captions p { margin: 0; overflow-wrap: anywhere; }
    #captions .you { color: var(--muted); }
    #captions .you::before { content: "You: "; font-weight: 700; }
    #captions .eyes { color: var(--fg); }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap;
    }
  </style>
</head>
<body data-phase="idle" data-activity="listening">
  <video id="preview" playsinline muted aria-hidden="true"></video>

  <div id="brand" aria-hidden="true">Live Eyes</div>
  <a id="modeLink" href="?mode=snapshot">Snapshot mode</a>

  <button id="main" type="button">
    <span id="ring" aria-hidden="true"><span id="dot"></span></span>
    <span id="label">Start</span>
    <span id="sub">Tap anywhere to start. Then just ask what you want to know.</span>
  </button>

  <div id="watching" hidden></div>

  <!-- Announced by screen readers when the app changes state. -->
  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

  <!-- Transcript. Not auto-announced (Gemini already speaks it), but reachable
       with a screen reader or braille display. -->
  <div id="captions" role="log" aria-live="off" aria-label="Conversation transcript"></div>

  <script src="mediaUtils.js"></script>
  <script src="live-client.js"></script>
  <script src="prompt.js"></script>
  <script src="app.js"></script>
</body>
</html>
